services:
  - type: web
    name: temporalai-backend
    env: python
    rootDir: backend
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite:///./temporalai.db
      - key: DATA_PATH
        value: ../Forecasting Case- Study.xlsx
      - key: LLM_API_KEY
        sync: false
